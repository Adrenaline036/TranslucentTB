name: Build TranslucentTB (all platforms)

# Builds x64 and ARM64 in parallel. Triggered by pushes to the release branch and
# by manual dispatch. Artifacts are kept 30 days.
#
# To publish a permanent Release instead, push a version tag:
#   git tag v2026.2-patched && git push origin v2026.2-patched
# which runs release.yml.

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttb-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x64:
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: x64

  arm64:
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ARM64
